services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: innerarc
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: innerarc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://innerarc:secret@postgres:5432/innerarc?sslmode=disable
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_USER: ""
      SMTP_PASS: ""
      ALERT_EMAIL: "alerts@innerarc.local"
      # Optional - leave both keys unset and the AI coach falls back to a
      # rule-based responder. Set one in a local .env file (not committed)
      # or export it in your shell before `docker compose up`.
      # GROQ_API_KEY takes priority if both are set - see ai/agent.go.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      - postgres
      - redis
  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
volumes:
  pgdata:
