name: innerarc_frontend
description: Alongside - a calm space to check in
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.5
  fl_chart: ^0.65.0
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.7
  web_socket_channel: ^2.4.0
  pointycastle: ^3.7.3          # E2E vault encryption (AES-256-GCM)
  convert: ^3.1.1               # hex encoding for encrypted payloads
  crypto: ^3.0.3                # supporting hash utilities
  intl: ^0.19.0                 # message timestamp formatting
  google_fonts: ^6.2.1          # Fraunces + Manrope for the app's type system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
